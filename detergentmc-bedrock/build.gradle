// Bedrock layer (Geyser-like + Floodgate-like), built into DetergentMC.
//
// This module contains NO Geyser code, NO Floodgate code, NO Paper code and
// NO Mojang code. Everything here was written from the public protocol
// documentation (wiki.vg / Minecraft Wiki / wiki.bedrock.dev / the
// PrismarineJS minecraft-data protocol descriptions for Bedrock 1.20.40):
// the RakNet offline handshake, the Bedrock game-packet batch format, the
// Login JWT chain, and the packet IDs used for chat / movement.
//
// It reuses the Java side instead of duplicating it: packet IDs for the
// Java backend come from io.detergentmc.protocol.PacketIds, and Java
// packet framing from MinecraftPacket / PacketIO / VarInt. There is no
// second copy of the Java registry tables here.
dependencies {
    implementation project(':detergentmc-protocol')
}
