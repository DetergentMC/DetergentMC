# DetergentMC per-version build numbers.
#
# Each Minecraft version has its OWN independent build counter.
# A rebuild of one version bumps only that version's number:
# e.g. if 26.2 reaches build 2, 26.3 still starts at 1.
# New versions start at 1. A version missing from this file also means 1.
#
# File names come out as: DetergentMC-<version>-<build>.jar
# e.g. DetergentMC-1.20.4-1.jar, DetergentMC-26.2-2.jar, DetergentMC-26.3-1.jar
