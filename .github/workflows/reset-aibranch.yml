# AIBranchを掲示板だけにするための一度きりのワークフロー。
# 連携（MuseのGitHub連携）ではファイルの削除ができないため、
# Actions上でgit操作をしてAIBranchの中身を整理する。
# 使い終わっても消さずに置いておく（掲示板の再整理のときにまた使える）。
#
# 実行方法：GitHubのActionsタブで「Reset AIBranch to board only」を選び、
# 「Run workflow」でブランチ main を選んで実行する。
# AIBranchが STATUS.md と AI-INSTRUCTIONS.md だけになる。

name: Reset AIBranch to board only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: AIBranch
          fetch-depth: 0
      - name: Keep only the board files
        run: |
          git config user.name "appipinopi"
          git config user.email "appipinopi@gmail.com"
          # 指示書を docs/ の中からルートへ出す（むき出しにする）。
          git mv docs/AI-INSTRUCTIONS.md AI-INSTRUCTIONS.md
          # STATUS.md と AI-INSTRUCTIONS.md 以外をすべて削除する。
          ls -A | grep -v -e '^STATUS.md$' -e '^AI-INSTRUCTIONS.md$' -e '^\.git$' | xargs -r git rm -r -q --
          git status --porcelain
          git commit -m "AIBranchを掲示板だけにする（STATUS.mdとAI-INSTRUCTIONS.mdのみ）" || echo "nothing to commit"
          git push origin AIBranch
