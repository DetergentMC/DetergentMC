// Protocol layer: client-version handling, block translation for old
// clients, resource-pack delivery, and the Netty proxy that lets a
// 1.20.1 (763) client join the 1.20.4 (765) vanilla server.
// The proxy is the wire implementation (see ClientProxy / ProxySession).
dependencies {
    implementation project(':detergentmc-api')
    // Netty: the proxy's TCP server / client. Pinned to the version
    // whose framing behaviour this code was written against.
    implementation 'io.netty:netty-all:4.1.111.Final'
}
