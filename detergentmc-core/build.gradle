// Run the skeleton server: ./gradlew :detergentmc-core:runServer
// The server runs from the `run/` directory (created on first start).
tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Runs the DetergentMC 1.20.4 skeleton server from the run/ directory.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.detergentmc.core.Main'
    workingDir = file("${rootProject.projectDir}/run")
    // Japanese messages are a core feature: force UTF-8 for console
    // input/output even when the JVM default encoding is US-ASCII.
    jvmArgs '-Dfile.encoding=UTF-8'
    // The task already runs inside run/, so tell Main to use it directly
    // (its default --workdir is "run", which would nest to run/run/).
    args = ['--workdir', '.']
    doFirst {
        workingDir.mkdirs()
    }
}

// Merges the VersionAdapter service registrations from every adapter
// module into one file. A plain fat jar would lose all but one of them:
// each adapter ships META-INF/services/io.detergentmc.api.VersionAdapter
// and duplicatesStrategy EXCLUDE keeps only the first copy, so the
// other adapters would silently disappear from the fat jar (this bit
// step B: with only the 1.20.4 adapter the jar started, with 1.20.1
// added it failed with "No version adapter found for Minecraft 1.20.1").
// The merged file lists every adapter found on the runtime classpath.
tasks.register('mergeVersionAdapterServices') {
    group = 'build'
    description = 'Merges META-INF/services/io.detergentmc.api.VersionAdapter from all adapter modules.'
    def outDir = layout.buildDirectory.dir('merged-services')
    outputs.dir(outDir)
    // The sibling module jars must exist before they can be read.
    dependsOn configurations.runtimeClasspath
    doLast {
        def names = new LinkedHashSet<String>()
        configurations.runtimeClasspath.files.each { file ->
            def lines = []
            if (file.isDirectory()) {
                def service = new File(file,
                        'META-INF/services/io.detergentmc.api.VersionAdapter')
                if (service.exists()) {
                    lines = service.readLines()
                }
            } else if (file.name.endsWith('.jar')) {
                def zip = new java.util.zip.ZipFile(file)
                try {
                    def entry = zip.getEntry(
                            'META-INF/services/io.detergentmc.api.VersionAdapter')
                    if (entry != null) {
                        lines = zip.getInputStream(entry).readLines()
                    }
                } finally {
                    zip.close()
                }
            }
            lines.each { line ->
                def name = line.trim()
                if (name && !name.startsWith('#')) {
                    names.add(name)
                }
            }
        }
        def target = outDir.get().dir('META-INF/services').asFile
        target.mkdirs()
        new File(target, 'io.detergentmc.api.VersionAdapter').text =
                names.join('\n') + '\n'
        println 'Merged VersionAdapter services: ' + names
    }
}

// Fat jar: `java -jar detergentmc-0.1.0-1.20.4.jar` with no classpath.
// Built with the standard Gradle Jar task only (no Shadow plugin):
// every module (api / core / adapter-v1_20_4 / adapter-v1_20_1 /
// adapter-v1_20_2 / adapter-v1_20_5 / adapter-v1_21 / protocol / content)
// and SnakeYAML are unpacked into a single jar.
// The vanilla server jar is NOT included - it is still fetched from
// Mojang on first start - and neither is hello-bubble, which stays a
// separate jar in run/bubbles/.
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a self-contained fat jar runnable with java -jar (no classpath needed).'
    archiveBaseName = 'detergentmc'
    archiveVersion = '0.1.0-1.20.4'
    archiveClassifier = ''
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
    manifest {
        attributes 'Main-Class': 'io.detergentmc.core.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // The runtime classpath contains jars produced by sibling modules;
    // declare the dependency explicitly so task ordering is validated.
    dependsOn configurations.runtimeClasspath
    dependsOn tasks.named('mergeVersionAdapterServices')
    // Drop signature files from merged jars so the JVM does not reject
    // the fat jar as tampered.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        // The per-adapter service files are replaced by the merged one
        // below (see mergeVersionAdapterServices): without this, only
        // the first adapter would survive in the fat jar.
        exclude 'META-INF/services/io.detergentmc.api.VersionAdapter'
    }
    from(layout.buildDirectory.dir('merged-services'))
}

// Versioned jars: `DetergentMC-1.20.4-1.jar` and friends.
//
// The fat jar above is universal: one jar runs every supported Minecraft
// version (each version's adapter is inside). The per-version files made
// here are copies of that same jar, renamed per Minecraft version so a
// download page can offer one file per version:
//   DetergentMC-<minecraft-version>-<build>.jar
// e.g. DetergentMC-1.20.4-1.jar, DetergentMC-1.19.2-1.jar.
//
// The build number is PER VERSION, read from the root
// `build-numbers.properties` (one counter per Minecraft version, each
// independent: 26.2 at build 2 does not make 26.3 build 3, it starts at 1).
// A version missing from that file means 1. Bump only the version whose
// jar is rebuilt for release. New versions start at 1.
// The version list must match the supported versions in docs/VERSIONS.md
// (and the version branches on GitHub): update it when a version is added.
tasks.register('versionedJars') {
    group = 'build'
    description = 'Copies the fat jar to per-Minecraft-version files (DetergentMC-<version>-<build>.jar, one build counter per version).'
    dependsOn tasks.named('fatJar')
    def fatJarFile = tasks.named('fatJar').flatMap { it.archiveFile }
    def buildNumbersFile = rootProject.file('build-numbers.properties')
    def buildNumbers = new Properties()
    if (buildNumbersFile.exists()) {
        buildNumbersFile.withInputStream { buildNumbers.load(it) }
    }
    def buildNumberFor = { mcVersion -> buildNumbers.getProperty(mcVersion, '1') }
    def versions = [
        '1.12', '1.12.1', '1.12.2',
        '1.13', '1.13.1', '1.13.2',
        '1.14', '1.14.1', '1.14.2', '1.14.3', '1.14.4',
        '1.15', '1.15.1', '1.15.2',
        '1.18.2',
        '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
        '1.20', '1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
        '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
        '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11',
        '26.1', '26.1.1', '26.1.2', '26.2',
    ]
    doLast {
        def src = fatJarFile.get().asFile
        def outDir = rootProject.layout.buildDirectory.dir('libs').get().asFile
        versions.each { mcVersion ->
            def dest = new File(outDir, "DetergentMC-${mcVersion}-${buildNumberFor(mcVersion)}.jar")
            dest.bytes = src.bytes
        }
        println "Versioned jars (${versions.size()} files): ${versions.collect { "DetergentMC-${it}-${buildNumberFor(it)}.jar" }.join(', ')}"
    }
}

// The fat jar is part of a normal build so `./gradlew build` always
// produces the runnable artifact.
tasks.named('build') {
    dependsOn tasks.named('fatJar')
    dependsOn tasks.named('versionedJars')
}
