# DetergentMC English messages
# Placeholders use {0}, {1}, ...
server:
  starting: "Starting DetergentMC {0} (Minecraft {1})..."
  started: "DetergentMC started. Bubbles loaded: {0}"
  stopped: "DetergentMC stopped."
  console-help: "Commands: help / bubbles / vanilla <command> / stop (Bubble commands work too)"
vanilla:
  starting: "Starting the vanilla server (Minecraft {0})..."
  ready: "Vanilla server is ready (port {0})."
  ready-simple: "Vanilla server is ready."
  failed: "Failed to start the vanilla server: {0}"
  not-running: "The vanilla server is not running."
  usage: "Usage: vanilla <command> (e.g. vanilla list)"
resource-pack:
  prompt: "Accept the DetergentMC resource pack? It adds textures such as the bubble."
  enabled: "Serving the resource pack: {0}"
  external-enabled: "Using the external resource pack (no local server): {0}"
  disabled: "The resource pack is disabled."
  failed: "Failed to start the resource pack (continuing without one): {0}"
  config-warning: "There is a problem with the resource pack configuration: {0}"
  required-failed: "The resource pack is required (required=true) but could not be prepared: {0}. The server will not start."
datapack:
  generated: "Generated the datapack: {0}"
  failed: "Failed to generate the datapack (continuing without the /trigger bridge): {0}"
command:
  unknown: "Unknown command: {0}"
  bubbles-empty: "No Bubbles are loaded."
  bubbles-line: "- {0} v{1}"
  hello: "Hello, {0}! Welcome to DetergentMC."
  lang:
    usage: "Usage: /lang <ja|en>"
    set: "Language set to {0}."
    unknown: "Unsupported language: {0} (use ja or en)"
bubble:
  enabled: "Enabled Bubble: {0} v{1}"
  disabled: "Disabled Bubble: {0}"
player:
  join: "{0} joined."
  leave: "{0} left."
