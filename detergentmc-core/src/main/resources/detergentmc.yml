# Maximum players (enforced by the vanilla server).
# 最大プレイヤー数（バニラサーバー側で適用されます）。
max-players: 20

# Bedrock settings (Geyser-like) / Bedrock（統合版）の設定
# Bedrock clients (1.20.40 / 1.20.50) connect over RakNet UDP.
# DetergentMC translates them into Java players on the internal
# vanilla server (see docs/BEDROCK.md). No encryption and no Xbox
# signature verification yet: see the security notes in docs/BEDROCK.md
# before opening this to strangers.
# Bedrockクライアント（1.20.40／1.20.50）が RakNet UDP で参加します。
# DetergentMC が Java プレイヤーに翻訳して内部バニラへ繋ぎます
# （くわしくは docs/BEDROCK.md）。暗号化なし・Xbox 署名検証なしのため、
# 見知らぬ人に開く前に docs/BEDROCK.md のセキュリティ注意を読んでください。
bedrock:
  # Whether to listen for Bedrock clients.
  # Bedrock クライアントを受け入れるかどうか。
  enabled: true
  # UDP port Bedrock clients connect to (default 19132).
  # Bedrock クライアントが接続する UDP ポート（既定 19132）。
  port: 19132
  # MOTD line 1 shown in the Bedrock server list.
  # Empty means the Java motd (server.motd).
  # Bedrock のサーバーリストに表示する MOTD 行1。
  # 空なら Java の MOTD（server.motd）を使います。
  motd: ""
  # Chunk radius sent to Bedrock clients (in chunks, 1-12, default 6).
  # The client only shows terrain inside this radius around the player.
  # Bedrock クライアントへ送るチャンクの半径（チャンク単位、1〜12、既定 6）。
  # プレイヤー周辺のこの範囲だけ地形が見えます。
  chunk-radius: 6

# Floodgate-like identity settings / Floodgate 風の ID 設定
# Bedrock players have no Java account, so DetergentMC derives a stable
# Java UUID (UUID v3) from their Xbox XUID and prefixes their gamertag
# (default ".") to make a Java name of 16 characters or fewer.
# Bedrock プレイヤーには Java アカウントが無いため、Xbox の XUID から
# 安定した Java UUID（UUID v3）を作り、ゲーマータグの先頭に
# プレフィックス（既定 "."）を付けて 16 文字以内の Java 名にします。
floodgate:
  # Prefix for Bedrock players' Java names (e.g. ".Steve").
  # Bedrock プレイヤーの Java 名の先頭に付ける文字（例：".Steve"）。
  prefix: "."

# Legacy (pre-Netty) clients: Minecraft 1.6.4 (legacy protocol 78).
# A separate frontend listens on its own TCP port and translates the
# old wire protocol (no length prefix, RSA + AES/CFB8 login even in
# offline mode). Legacy clients can only authenticate offline: the old
# Mojang auth endpoints no longer exist, so enabling this means running
# the server in offline mode. When minecraft-version is 1.6.4 the
# frontend starts automatically in direct mode and modern clients
# cannot join. See docs/PROXY-1.6.4.md.
# レガシー（Netty 以前）クライアント：Minecraft 1.6.4（レガシー
# プロトコル78）。専用フロントエンドが別ポートで待ち受け、旧ワイヤ
# （長さ接頭辞なし、offline でも RSA＋AES/CFB8 のログイン）を変換
# します。旧クライアントの認証は offline しか成立しないため（旧
# Mojang 認証は廃止済み）、有効化は offline モード運用が前提です。
# minecraft-version が 1.6.4 の場合は自動でダイレクトモードで
# 起動し、現代クライアントは参加できません。docs/PROXY-1.6.4.md 参照。
legacy:
  # Whether to accept legacy clients (bridge mode). Ignored when
  # minecraft-version is 1.6.4 (the frontend always starts then).
  # レガシークライアントを受け入れるかどうか（ブリッジモード）。
  # minecraft-version が 1.6.4 のときは無効で、常時起動します。
  enabled: false
  # TCP port legacy clients connect to (default 25568).
  # レガシークライアントが接続する TCP ポート（既定 25568）。
  port: 25568
  # MOTD shown in the legacy server list. Empty means server.motd.
  # レガシーのサーバーリストに表示する MOTD。空なら server.motd。
  motd: ""
