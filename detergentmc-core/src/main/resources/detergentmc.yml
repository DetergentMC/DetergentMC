# =====================================================================
# DetergentMC configuration / DetergentMC の設定
# =====================================================================
# This file is created on first start. Edit it, then restart the server.
# 初回起動時に作成されます。編集したらサーバーを再起動してください。
# ---------------------------------------------------------------------

# Minecraft version this server build runs.
# このサーバービルドが動かす Minecraft バージョン。
# The matching version adapter is loaded at runtime (ServiceLoader).
# 対応するバージョンアダプターが起動時に読み込まれます。
# MVP 0.1.0 supports only: 1.20.4
# MVP 0.1.0 で対応しているのは 1.20.4 のみです。
minecraft-version: "1.20.4"

# Language settings / 言語設定
language:
  # Server default language (fallback language).
  # サーバーの標準言語（フォールバック言語）。
  # Supported out of the box: ja, en
  # 最初から使える言語: ja, en
  default: ja
  # Extra language files in locales/ are loaded automatically.
  # locales/ に言語ファイルを追加すると自動で読み込まれます。

# Server name shown in logs and messages.
# ログやメッセージに表示されるサーバー名。
server-name: "DetergentMC"

# Server network settings / サーバーのネットワーク設定
server:
  # Port players connect to (the DetergentMC proxy listens here).
  # プレイヤーが接続する公開ポート（DetergentMCのプロキシが待ち受ける）。
  port: 25565
  # Port the vanilla server listens on (loopback only: 127.0.0.1).
  # The proxy forwards to this port. Do not expose it directly.
  # バニラサーバーが待ち受ける内部ポート（ループバックのみ）。
  # プロキシがここへ中継する。直接公開しないこと。
  internal-port: 25566
  # Online mode (true = Mojang account authentication).
  # オンラインモード (true = Mojangアカウント認証あり)。
  # 認証はプロキシがクライアントとの間で完結させます。内部バニラは
  # 常に offline-mode（信頼済み接続）で動きます。認証済みの接続だけが
  # プロキシ経由で内部バニラへ届きます。
  # Authentication is completed by the proxy. The internal vanilla
  # server always runs offline-mode (trusted backend); only
  # proxy-authenticated connections reach it.
  online-mode: true
  # Mojang session server used by the proxy to verify logins when
  # online-mode is true. Empty means the default
  # (https://sessionserver.mojang.com). Only change this for tests
  # (a local fake session server) or if Mojang moves the endpoint.
  # プロキシ認証の照会先。空なら既定（本物の Mojang セッションサーバー）。
  # テスト（ローカルの偽サーバー）以外では変えないでください。
  session-server-url: ""
  # Message of the day shown in the server list.
  # サーバーリストに表示される MOTD。
  motd: "DetergentMC 1.20.4"

# Surfactant forwarding / Surfactant からの転送
# When this DetergentMC sits behind the Surfactant proxy, set the same
# shared secret here that the Surfactant backend entry uses
# (forwarding-secret in surfactant.yml, or the global forwarding.secret
# there). Surfactant then forwards each player's verified identity
# (UUID, name, IP address, profile properties) with an HMAC signature
# during login, and DetergentMC adopts it as the player's identity.
# Surfactant の後ろに置く場合は、Surfactant 側のバックエンド設定
# （forwarding-secret、または全体の forwarding.secret）と同じ秘密を
# ここにも設定してください。ログインのたびに Surfactant が署名付きで
# プレイヤーの素性（UUID・名前・IP・プロパティ）を転送し、
# DetergentMC はそれをそのプレイヤーの素性として採用します。
# WARNING: while a secret is set, EVERY login must come through
# Surfactant and pass verification. Direct connections are rejected.
# 注意：秘密を設定している間は、ログインはすべて Surfactant 経由で
# 検証を通る必要があります。直接の接続は拒否されます。
# Empty (default) disables forwarding; direct connections work as usual.
# 空（既定）なら転送は無効で、従来通りに直接接続できます。
forwarding:
  secret: ""

# Vanilla server settings / バニラサーバーの設定
vanilla:
  # Maximum heap for the vanilla server process, in megabytes.
  # バニラサーバープロセスの最大ヒープ (メガバイト)。
  memory-mb: 1024

# Resource pack settings / リソースパックの設定
# DetergentMC generates a small demo pack (a bubble texture) and serves it
# over HTTP on loopback, then tells the vanilla server about it through
# server.properties (resource-pack / resource-pack-sha1).
# DetergentMC は小さなデモパック（泡テクスチャ）を生成してループバックで
# HTTP配信し、server.properties 経由でバニラサーバーに伝えます。
resource-pack:
  # Whether to generate and offer the resource pack.
  # リソースパックを生成・配信するかどうか。
  enabled: true
  # Port the pack is served on (loopback only: http://127.0.0.1:<port>/detergentmc-pack.zip).
  # パックを配信するポート（ループバックのみ）。
  # 25566 はバニラサーバーの内部ポート（server.internal-port）になったため、
  # 既定は 25567 に変わった。
  port: 25567
  # Whether clients must accept the pack to play (false = optional).
  # パックの受信を必須にするかどうか（false = 任意）。
  required: false
  # Public URL of the pack (optional). Leave empty for loopback delivery
  # (the default): the pack is generated and served on 127.0.0.1 only.
  # Only an https:// URL selects external mode; an http:// URL is
  # refused (with a warning) and falls back to loopback.
  # The public hosting location is NOT decided yet — do not invent one.
  # When it is decided, write its https:// URL here.
  # 公開URL（任意）。空のままならループバック配信（既定）。
  # https:// で始まるURLだけが外部配信として使われます。
  # http:// は拒否され（警告ログ）、ループバックに切り替わります。
  # 公開する置き場所はまだ決まっていません。決まったらここに書いてください。
  url: ""
  # SHA-1 of the pack file hosted at url (40 hex digits, required when
  # url is set). Check it with e.g. `sha1sum detergentmc-pack.zip`.
  # DetergentMC only checks the shape of this value: it never downloads
  # the hosted file and never compares it against the locally generated
  # pack (the hosted file may legitimately differ). If the value does
  # not match the hosted file, the Minecraft client itself rejects the
  # pack when downloading it. Update this together with the hosted file.
  # url を使うときに必須のSHA-1（40桁の16進数）。
  # `sha1sum detergentmc-pack.zip` で確認した値を書いてください。
  # 形（40桁の16進数）だけを検証します。ホストされたファイルを
  # ダウンロードして照合することはしません。値がホストされたファイルと
  # 違う場合、クライアント側でパックが拒否されます。ファイルを
  # 差し替えたらこの値も一緒に更新してください。
  sha1: ""
  # 1.18.2 pack for 758 clients (optional; external mode only).
  # When the 1.18.2 variant of the pack (pack_format 8) is hosted
  # separately, write its https:// URL and SHA-1 here and the proxy
  # offers it to 1.18.2 clients instead of the 1.19 pack below.
  # Leave both empty to offer the 1.19 pack (when configured),
  # the 1.19.1 / 1.19.2 pack (when configured), the 1.19.3 pack
  # (when configured), the 1.19.4 pack (when configured),
  # the 1.20.1 pack (when configured) or the 1.20.4 pack to 758 clients.
  # In loopback mode these two
  # are ignored: all variants are generated and served locally.
  # 758クライアント向けの1.18.2用パック（任意・外部配信時のみ）。
  # pack_format 8 のパックを別途ホストした場合は、その https:// URL
  # とSHA-1をここに書くと、プロキシが1.18.2クライアントにこちらを
  # 出します。空のままなら758クライアントには1.19用パック
  # （設定時のみ）、1.19.1／1.19.2用パック（設定時のみ）、1.19.3用パック
  # （設定時のみ）、1.19.4用パック（設定時のみ）、1.20.1用パック
  # （設定時のみ）または1.20.4用パックを出します。
  # ループバック配信では無視されます（全バリアントを自動生成・配信します）。
  url-758: ""
  sha1-758: ""
  # 1.19.3 pack for 761 clients (optional; external mode only).
  # 1.19 pack for 759 clients (optional; external mode only).
  # When the 1.19 variant of the pack (pack_format 9) is hosted
  # separately, write its https:// URL and SHA-1 here and the proxy
  # offers it to 1.19 clients instead of the 1.19.1 / 1.19.2 pack below.
  # Leave both empty to offer the 1.19.1 / 1.19.2 pack (when configured),
  # the 1.19.3 pack (when configured), the 1.19.4 pack (when configured),
  # the 1.20.1 pack (when configured) or the 1.20.4 pack to 759 clients.
  # In loopback mode these two
  # are ignored: all variants are generated and served locally.
  # 759クライアント向けの1.19用パック（任意・外部配信時のみ）。
  # pack_format 9 のパックを別途ホストした場合は、その https:// URL
  # とSHA-1をここに書くと、プロキシが1.19クライアントにこちらを
  # 出します。空のままなら759クライアントには1.19.1／1.19.2用パック
  # （設定時のみ）、1.19.3用パック（設定時のみ）、1.19.4用パック
  # （設定時のみ）、1.20.1用パック（設定時のみ）または1.20.4用パックを出します。
  # ループバック配信では無視されます（全バリアントを自動生成・配信します）。
  url-759: ""
  sha1-759: ""
  # 1.19.1 / 1.19.2 pack for 760 clients (optional; external mode only).
  # When the 1.19.1 / 1.19.2 variant of the pack (pack_format 9) is hosted
  # separately, write its https:// URL and SHA-1 here and the proxy
  # offers it to 1.19.1 / 1.19.2 clients instead of the 1.19.3 pack below.
  # Leave both empty to offer the 1.19.3 pack (when configured), the
  # 1.19.4 pack (when configured), the 1.20.1 pack (when configured)
  # or the 1.20.4 pack to 760 clients.
  # In loopback mode these two
  # are ignored: all variants are generated and served locally.
  # 760クライアント向けの1.19.1／1.19.2用パック（任意・外部配信時のみ）。
  # pack_format 9 のパックを別途ホストした場合は、その https:// URL
  # とSHA-1をここに書くと、プロキシが1.19.1／1.19.2クライアントにこちらを
  # 出します。空のままなら760クライアントには1.19.3用パック
  # （設定時のみ）、1.19.4用パック（設定時のみ）、1.20.1用パック
  # （設定時のみ）または1.20.4用パックを出します。
  # ループバック配信では無視されます（全バリアントを自動生成・配信します）。
  url-760: ""
  sha1-760: ""
  # When the 1.19.3 variant of the pack (pack_format 12) is hosted
  # separately, write its https:// URL and SHA-1 here and the proxy
  # offers it to 1.19.3 clients instead of the 1.19.4 pack below.
  # Leave both empty to offer the 1.19.4 pack (when configured), the
  # 1.20.1 pack (when configured) or the 1.20.4 pack to 761 clients.
  # In loopback mode these two
  # are ignored: all variants are generated and served locally.
  # 761クライアント向けの1.19.3用パック（任意・外部配信時のみ）。
  # pack_format 12 のパックを別途ホストした場合は、その https:// URL
  # とSHA-1をここに書くと、プロキシが1.19.3クライアントにこちらを
  # 出します。空のままなら761クライアントには1.19.4用パック
  # （設定時のみ）、1.20.1用パック（設定時のみ）または1.20.4用パックを出します。
  # ループバック配信では無視されます（全バリアントを自動生成・配信します）。
  url-761: ""
  sha1-761: ""
  # 1.19.4 pack for 762 clients (optional; external mode only).
  # When the 1.19.4 variant of the pack (pack_format 13) is hosted
  # separately, write its https:// URL and SHA-1 here and the proxy
  # offers it to 1.19.4 clients instead of the 1.20.4 pack above.
  # Leave both empty to offer the 1.20.1 pack (when configured) or the
  # 1.20.4 pack to 762 clients. In loopback mode these two
  # are ignored: all variants are generated and served locally.
  # 762クライアント向けの1.19.4用パック（任意・外部配信時のみ）。
  # pack_format 13 のパックを別途ホストした場合は、その https:// URL
  # とSHA-1をここに書くと、プロキシが1.19.4クライアントにこちらを
  # 出します。空のままなら762クライアントには1.20.1用パック
  # （設定時のみ）または1.20.4用パックを出します。
  # ループバック配信では無視されます（全バリアントを自動生成・配信します）。
  url-762: ""
  sha1-762: ""
  # 1.20.1 pack for 763 clients (optional; external mode only).
  # When the 1.20.1 variant of the pack (pack_format 15) is hosted
  # separately, write its https:// URL and SHA-1 here and the proxy
  # offers it to 1.20.1 clients instead of the 1.20.4 pack above.
  # Leave both empty to offer the 1.20.4 pack to every client (a 1.20.1
  # client then shows it as incompatible). In loopback mode these two
  # are ignored: both variants are generated and served locally.
  # 763クライアント向けの1.20.1用パック（任意・外部配信時のみ）。
  # pack_format 15 のパックを別途ホストした場合は、その https:// URL
  # とSHA-1をここに書くと、プロキシが1.20.1クライアントにこちらを
  # 出します。空のままなら全クライアントに1.20.4用パックを出します
  # （1.20.1クライアントには「互換性なし」と表示されます）。
  # ループバック配信では無視されます（両方を自動生成・配信します）。
  url-763: ""
  sha1-763: ""
  # 1.20.2 pack for 764 clients (optional; external mode only).
  # Same rules as url-763 / sha1-763, but the hosted pack must be
  # pack_format 18 (the 1.20.1 pack, format 15, is NOT shared with
  # 1.20.2 clients: a 1.20.2 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 764 clients.
  # In loopback mode these two are ignored: all three variants are
  # generated and served locally.
  # 764クライアント向けの1.20.2用パック（任意・外部配信時のみ）。
  # url-763 / sha1-763 と同じ決まりですが、ホストするパックは
  # pack_format 18 のものが必要です。1.20.1用パック（format 15）は
  # 1.20.2クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら764クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（3つとも自動生成・配信します）。
  url-764: ""
  sha1-764: ""
  # 1.20.5 / 1.20.6 pack for 766 clients (optional; external mode only).
  # Same rules as url-763 / sha1-763, but one pack serves both 1.20.5
  # and 1.20.6 (they share protocol 766) and the hosted pack must be
  # pack_format 32 (the 1.20.4 pack, format 22, is NOT shared with
  # 766 clients: a 1.20.5 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 766 clients.
  # In loopback mode these two are ignored: all four variants are
  # generated and served locally.
  # 766クライアント向けの1.20.5／1.20.6用パック（任意・外部配信時のみ）。
  # url-763 / sha1-763 と同じ決まりですが、1.20.5と1.20.6はプロトコル766を
  # 共有するため1つのパックで両方に使え、ホストするパックは
  # pack_format 32 のものが必要です。1.20.4用パック（format 22）は
  # 766クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら766クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（4つとも自動生成・配信します）。
  url-766: ""
  sha1-766: ""
  # 1.21 / 1.21.1 pack for 767 clients (optional; external mode only).
  # Same rules as url-763 / sha1-763, but one pack serves both 1.21
  # and 1.21.1 (they share protocol 767) and the hosted pack must be
  # pack_format 34 (the 1.20.5 pack, format 32, is NOT shared with
  # 767 clients: a 1.21 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 767 clients.
  # In loopback mode these two are ignored: all five variants are
  # generated and served locally.
  # 767クライアント向けの1.21／1.21.1用パック（任意・外部配信時のみ）。
  # url-763 / sha1-763 と同じ決まりですが、1.21と1.21.1はプロトコル767を
  # 共有するため1つのパックで両方に使え、ホストするパックは
  # pack_format 34 のものが必要です。1.20.5用パック（format 32）は
  # 767クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら767クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（5つとも自動生成・配信します）。
  url-767: ""
  sha1-767: ""
  # 1.21.2 / 1.21.3 pack for 768 clients (optional; external mode only).
  # Same rules as url-767 / sha1-767, but one pack serves both 1.21.2
  # and 1.21.3 (they share protocol 768) and the hosted pack must be
  # pack_format 42 (the 1.21 pack, format 34, is NOT shared with
  # 768 clients: a 1.21.2 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 768 clients.
  # In loopback mode these two are ignored: all six variants are
  # generated and served locally.
  # 768クライアント向けの1.21.2／1.21.3用パック（任意・外部配信時のみ）。
  # url-767 / sha1-767 と同じ決まりですが、1.21.2と1.21.3はプロトコル768を
  # 共有するため1つのパックで両方に使え、ホストするパックは
  # pack_format 42 のものが必要です。1.21用パック（format 34）は
  # 768クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら768クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（11つとも自動生成・配信します）。
  url-768: ""
  sha1-768: ""
  # 1.21.4 pack for 769 clients (optional; external mode only).
  # Same rules as url-768 / sha1-768, but the hosted pack must be
  # pack_format 46 (the 1.21.2 pack, format 42, is NOT shared with
  # 769 clients: a 1.21.4 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 769 clients.
  # In loopback mode these two are ignored: all eight variants are
  # generated and served locally.
  # 769クライアント向けの1.21.4用パック（任意・外部配信時のみ）。
  # url-768 / sha1-768 と同じ決まりですが、ホストするパックは
  # pack_format 46 のものが必要です。1.21.2用パック（format 42）は
  # 769クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら769クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（11つとも自動生成・配信します）。
  url-769: ""
  sha1-769: ""
  # 1.21.5 pack for 770 clients (optional; external mode only).
  # Same rules as url-769 / sha1-769, but the hosted pack must be
  # pack_format 55 (the 1.21.4 pack, format 46, is NOT shared with
  # 770 clients: a 1.21.5 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 770 clients.
  # In loopback mode these two are ignored: all eleven variants are
  # generated and served locally.
  # 770クライアント向けの1.21.5用パック（任意・外部配信時のみ）。
  # url-769 / sha1-769 と同じ決まりですが、ホストするパックは
  # pack_format 55 のものが必要です。1.21.4用パック（format 46）は
  # 770クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら770クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（11つとも自動生成・配信します）。
  url-770: ""
  sha1-770: ""
  # 1.21.6 pack for 771 clients (optional; external mode only).
  # Same rules as url-770 / sha1-770, but the hosted pack must be
  # pack_format 63 (the 1.21.5 pack, format 55, is NOT shared with
  # 771 clients: a 1.21.6 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 771 clients.
  # In loopback mode these two are ignored: all eleven variants are
  # generated and served locally.
  # 771クライアント向けの1.21.6用パック（任意・外部配信時のみ）。
  # url-770 / sha1-770 と同じ決まりですが、ホストするパックは
  # pack_format 63 のものが必要です。1.21.5用パック（format 55）は
  # 771クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら771クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（11つとも自動生成・配信します）。
  url-771: ""
  sha1-771: ""
  # 1.21.7 pack for 772 clients (optional; external mode only).
  # Same rules as url-771 / sha1-771, but the hosted pack must be
  # pack_format 64 (the 1.21.6 pack, format 63, is NOT shared with
  # 772 clients: a 1.21.7 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 772 clients.
  # In loopback mode these two are ignored: all eleven variants are
  # generated and served locally.
  # 772クライアント向けの1.21.7用パック（任意・外部配信時のみ）。
  # url-771 / sha1-771 と同じ決まりですが、ホストするパックは
  # pack_format 64 のものが必要です。1.21.6用パック（format 63）は
  # 772クライアントには流用しません（「互換性なし」と表示されます）。
  # 空のままなら772クライアントにも1.20.4用パックを出します。
  # ループバック配信では無視されます（11つとも自動生成・配信します）。
  url-772: ""
  sha1-772: ""
  # 1.21.9 pack for 773 clients (optional; external mode only).
  # Same rules as url-772 / sha1-772, but the hosted pack must be
  # pack_format 69 (the 1.21.7 pack, format 64, is NOT shared with
  # 773 clients: a 1.21.9 client shows it as incompatible).
  # Leave both empty to offer the 1.20.4 pack to 773 clients.
  # In loopback mode these two are ignored: all eleven variants are
  # generated and served locally.
